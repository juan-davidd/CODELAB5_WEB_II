# ── Propiedades requeridas por el controlador ──────────────
api.version=v1
app.version=test

# ── Datasource H2 en memoria (sobreescribe el PostgreSQL de producción) ──
# IMPORTANTE: si no se sobreescribe, los tests heredarían jdbc:postgresql://localhost:5432
spring.datasource.url=jdbc:h2:mem:clientestest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── Dialecto H2 (sobreescribe el PostgreSQLDialect heredado) ──
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ── JPA: crear y destruir esquema en cada ejecución de pruebas ──
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── Desactivar carga de datos de producción ──
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# ── Actuator en puerto aleatorio para no chocar con el 8081 real ──
management.server.port=0
